[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome_api_shape_explorer"
version = "0.1.0"
description = "AST-based API shape analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Contributor", email = "dev@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
awesome-api-shape-explorer = "awesome_api_shape_explorer.cli:main"

[project.urls]
Homepage = "https://github.com/example/awesome-api-shape-explorer"
Issues = "https://github.com/example/awesome-api-shape-explorer/issues"
